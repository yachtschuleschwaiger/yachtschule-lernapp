<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yachtschule Schwaiger – A-Schein Segeln Binnen</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef4f8;color:#17324a}
header{background:#063d68;color:white;text-align:center;padding:24px 16px}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0;font-size:18px}
main{max-width:760px;margin:24px auto;padding:0 18px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 3px 14px #0002;text-align:center}
.slideshow{position:relative;width:100%;aspect-ratio:16/8.5;overflow:hidden;border-radius:14px;margin-bottom:24px;background:#dfe8ee}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.slide.active{opacity:1}
h2{margin:4px 0 14px}
.choice{display:block;text-decoration:none;background:#063d68;color:white;border-radius:14px;padding:19px;margin:15px 0;font-size:21px;font-weight:bold}
.choice small{display:block;font-size:14px;font-weight:normal;margin-top:6px;opacity:.9}
.slogan{margin-top:25px;font-weight:bold;color:#063d68;font-size:18px}
@media(max-width:600px){header h1{font-size:24px}.card{padding:15px}.choice{font-size:19px}}

.homepage-link{display:inline-block;margin:22px auto 6px;padding:11px 16px;border-radius:10px;
background:#eef4f8;color:#063d68;text-decoration:none;font-weight:700;border:1px solid #c9d8e3}
.homepage-link:hover{background:#e1ebf2}

</style>
</head>
<body>
<header><h1>Yachtschule Schwaiger</h1><p>A-Schein Segeln Binnen</p></header>
<main><div class="card">
<div class="slideshow">
<img class="slide active" src="aschein-startbild-01.webp" alt="">
<img class="slide" src="aschein-startbild-02.webp" alt="">
<img class="slide" src="aschein-startbild-03.webp" alt="">
</div>
<h2>Was möchtest du üben?</h2>
<a class="choice" href="aschein-pruefungsfragen.html">Prüfungsfragen
<small>40 Fragen · Single Choice · sofortige Auswertung</small></a>
<a class="choice" href="aschein-gesamtfragen.html">Gesamtfragen
<small>Gesamter Fragenkatalog · Single Choice · sofortige Auswertung</small></a>
<div class="slogan">Mit Sicherheit zum Schein.</div>
</div><div style="text-align:center"><a class="homepage-link" href="https://www.yachtschule-schwaiger.at/" target="_blank" rel="noopener">Mehr über unsere Kurse: Yachtschule Schwaiger</a></div>
</main>
<script>
const slides=[...document.querySelectorAll('.slide')]; let n=0;
setInterval(()=>{slides[n].classList.remove('active');n=(n+1)%slides.length;slides[n].classList.add('active');},5000);
</script>
</body></html>
