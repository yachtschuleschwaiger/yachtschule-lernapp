<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yachtschule Schwaiger – FB1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef4f8;color:#17324a}
header{background:#07549a;color:#fff;text-align:center;padding:20px 16px}
header h1{margin:0;font-size:27px}
header p{margin:6px 0 0;font-size:18px}
main{max-width:760px;margin:20px auto;padding:0 15px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px #0002;text-align:center}
.slideshow{position:relative;width:100%;height:360px;overflow:hidden;border-radius:14px;margin-bottom:20px;background:#dfe8ee}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.slide.active{opacity:1}
.choice{display:block;text-decoration:none;background:#07549a;color:#fff;border-radius:14px;padding:19px;margin:12px 0;font-size:20px;font-weight:bold}
.choice small{display:block;font-size:14px;font-weight:normal;margin-top:6px}
.home{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:10px;background:#eef4f8;color:#07549a;text-decoration:none;font-weight:bold}
.slogan{font-size:19px;font-weight:bold;color:#07549a;margin-top:16px}
@media(max-width:600px){header h1{font-size:24px}.slideshow{height:230px}.choice{font-size:19px;padding:17px}}
</style>
</head>
<body>
<header>
<h1>Yachtschule Schwaiger</h1>
<p>FB1 – Österreichisches Küstenpatent</p>
</header>
<main>
<div class="card">
<div class="slideshow">
<img class="slide active" src="fb1-bild-01.webp" alt="Segelyacht und Motorboot">
<img class="slide" src="fb1-bild-02.webp" alt="Segelyacht">
<img class="slide" src="fb1-bild-03.webp" alt="Yacht auf See">
</div>

<h2>FB1 Lern-App</h2>
<p>Wähle den gewünschten Fragenbereich:</p>

<a class="choice" href="fb1-pruefungsfragen(2).html">Prüfungsfragen
<small>FB1 – Single Choice</small></a>

<a class="choice" href="fb1-gesamtfragen(2).html">Gesamtfragen
<small>Alle FB1-Fragen zum Üben</small></a>

<div class="slogan">SEGELN. LERNEN. URLAUB</div>
<a class="home" href="https://www.yachtschule-schwaiger.at/" target="_blank" rel="noopener">Zur Yachtschule Schwaiger Homepage</a>
</div>
</main>
<script>
const slides=document.querySelectorAll('.slide');
let i=0;
setInterval(()=>{slides[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active')},4500);
</script>
</body>
</html>
