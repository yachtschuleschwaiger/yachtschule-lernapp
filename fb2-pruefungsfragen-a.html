function shuffle(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){pool=Q.filter(x=>area.value==='ALL'||x.code[0]===area.value).map(x=>JSON.parse(JSON.stringify(x)));shuffle(pool);i=0;points=0;startEl.hidden=true;done.hidden=true;quiz.hidden=false;show()}
const startEl=document.getElementById('start'),quiz=document.getElementById('quiz'),done=document.getElementById('done');
function show(){let x=pool[i];count.textContent=`Frage ${i+1} / ${pool.length} · ${x.code}`;score.textContent=`Richtig: ${points}`;question.textContent=x.q;answers.innerHTML='';next.hidden=true;
let opts=x.a.map((t,n)=>({t,n}));shuffle(opts);opts.forEach(o=>{let b=document.createElement('button');b.className='ans';b.textContent=o.t;b.onclick=()=>choose(b,o.n,x.c);answers.appendChild(b)})}
function choose(btn,n,c){[...answers.children].forEach(b=>b.disabled=true); if(n===c){btn.classList.add('good');points++}else{btn.classList.add('bad');[...answers.children].forEach(b=>{if(b.textContent===pool[i].a[c])b.classList.add('good')})} score.textContent=`Richtig: ${points}`;next.hidden=false}
function nextQ(){i++;if(i<pool.length)show();else{quiz.hidden=true;done.hidden=false;let p=Math.round(points/pool.length*100);result.textContent=`${points} von ${pool.length} richtig (${p} %)`;detail.textContent=p>=75?'75-%-Marke erreicht.':'Unter 75 % – weiter üben.'}}
</script>
<script>
// Einfacher Kopierschutz – kein vollständiger technischer Schutz möglich.
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('copy',e=>e.preventDefault());
document.addEventListener('cut',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&['c','u','s'].includes(k))){e.preventDefault();}
});
</script>
</body></html>
