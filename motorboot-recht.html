nger Ton, 2 kurze Töne","2 lange Töne, 1 kurzer Ton","2 lange Töne, 2 kurze Töne"],"a":1,"e":"Wenden über Backbord: 1 lang + 2 kurz."},{"q":"Wie lautet das Schallzeichen für Wenden über Steuerbord?","opts":["1 langer Ton, 1 kurzer Ton","1 langer Ton, 2 kurze Töne","2 lange Töne, 1 kurzer Ton","2 lange Töne, 2 kurze Töne"],"a":0,"e":"Wenden über Steuerbord: 1 lang + 1 kurz."},{"q":"Woran erkennt man ein Fahrgastschiff am See und welchen Abstand soll man halten?","opts":["Grüner Ball; 50 m bzw. größtmöglicher Abstand","Weißer Ball; 50 m bzw. größtmöglicher Abstand","Grüner Ball; mindestens 20 m Abstand","Weiße Flagge; mindestens 50 m Abstand"],"a":0,"e":"Fahrgastschiffe/Fähren führen einen grünen Ball; 50 m bzw. größtmöglichen Abstand halten."},{"q":"Welche Geschwindigkeitsbegrenzungen gelten auf Seen laut Fragenkatalog?","opts":["Tag 50 km/h, Nacht 25 km/h, Uferzone 10 km/h","Tag 50 km/h, Nacht 20 km/h, Uferzone 10 km/h","Tag 40 km/h, Nacht 25 km/h, Uferzone 10 km/h","Tag 50 km/h, Nacht 25 km/h, Uferzone 20 km/h"],"a":0,"e":"Im Skript: 50 km/h Tag, 25 km/h Nacht, 10 km/h in der Uferzone."},{"q":"Wie breit ist die Uferzone auf Seen?","opts":["100 m","150 m","200 m","300 m"],"a":2,"e":"Die Uferzone beträgt 200 m."},{"q":"Wer führt auf dem See einen grünen Ball?","opts":["Vorrangfahrzeuge, insbesondere Fahrgastschiffe/Fähren","Berufsfischer bei der Ausübung des Fischfangs","Fahrzeuge mit eingeschränkter Manövrierfähigkeit","Fahrzeuge, von denen aus Schleppangelfischerei betrieben wird"],"a":0,"e":"Der grüne Ball kennzeichnet Vorrangfahrzeuge."},{"q":"Wer führt auf dem See einen weißen Ball?","opts":["Berufsfischer","Vorrangfahrzeuge","Schleppangler","Fahrzeuge des Sicherheitsdienstes"],"a":0,"e":"Weißer Ball = Berufsfischer."},{"q":"Wer führt auf dem See eine weiße Flagge?","opts":["Fahrzeuge, von denen aus mit einer Schleppangel gefischt wird","Berufsfischer bei der Netzausbringung","Vorrangfahrzeuge im Linienverkehr","Fahrzeuge mit Taucher im Wasser"],"a":0,"e":"Weiße chwimmkörper","Sicherheitsdienst/Feuerwehr – Fahrgastschiffe – Berufsfischer – Maschinenfahrzeuge – Segel – Ruder – Schwimmkörper"],"a":0,"e":"So ist die Vorrangpyramide im Fragenkatalog angegeben."},{"q":"Welche Dokumente sind auf Wasserstraßen mitzuführen?","opts":["Patent, Zulassung und gegebenenfalls Fachurkunden wie Radar/Funk","Patent und Zulassung; Fachurkunden müssen nur an Land aufbewahrt werden","Patent, Zulassung und Versicherungsnachweis in jedem Fall","Zulassung und Lichtbildausweis; Patent nur bei Kontrollen vorzuweisen"],"a":0,"e":"Mitzuführen sind Patent, Zulassung und ggf. Fachurkunden."},{"q":"Welche Grundregel gilt beim Kreuzen von Kleinfahrzeugen auf Wasserstraßen?","opts":["Wer das andere Fahrzeug an Steuerbord hat, muss ausweichen","Wer das andere Fahrzeug an Backbord hat, muss ausweichen","Das talfahrende Kleinfahrzeug muss immer ausweichen","Das schnellere Kleinfahrzeug muss ausweichen"],"a":0,"e":"Rechtsvorrang: Wer das andere an Steuerbord hat, weicht aus."},{"q":"Wie verhalten sich Kleinfahrzeuge in Fahrwasserengen auf Wasserstraßen?","opts":["Sie müssen in jedem Fall warten","Sie dürfen einfahren, wenn sie sich am rechten Rand halten","Sie haben gegenüber Großfahrzeugen Vorrang, wenn sie zu Tal fahren","Sie dürfen nach Abgabe eines langen Tons einfahren"],"a":0,"e":"Das Skript nennt ausdrücklich eine Wartepflicht für Kleinfahrzeuge."},{"q":"Gibt es auf der Donau eine fixe Höchstgeschwindigkeit?","opts":["Nein; die Geschwindigkeit ist den Verhältnissen anzupassen","Ja; 50 km/h bei Tag und 25 km/h bei Nacht","Ja; außerhalb von Ortsgebieten 40 km/h","Nein; für Kleinfahrzeuge gilt jedoch generell 25 km/h"],"a":0,"e":"Keine fixe Höchstgeschwindigkeit; angepasst an Sicht, Wind, Wellen, Verkehr usw."},{"q":"Was bedeutet Hilfeleistungspflicht des Schiffsführers?","opts":["Hilfe leisten, soweit mit eigener Sicherheit vereinbar; sonst Hilfe holen","Hilfe leisten, auch wenn dadurch das eigene Fahrzeug erheblich gefährdet wird","Nur bei Personenschäden besteht Hilfeleistungspflicht","Hilfeleistung beschränkt sich auf das Verständigen der Einsatzkräfte"],"a":0,"e":"Jeder Schiffsführer ist zur Hilfeleistung verpflichtet, begrenzt durch die eigene Sicherheit."},{"q":"Wo kann man sich über Schifffahrtsbeschränkungen erkundigen?","opts":["U.a. BGBl/LGBl, Nachrichten für die Binnenschifffahrt, Internet/via donau","Ausschließlich in den Nachrichten für die Binnenschifffahrt","Bei der örtlichen Hafenbehörde; Veröffentlichungen im Internet sind nicht maßgeblich","Im Zulassungsschein des Fahrzeugs und in Seekarten"],"a":0,"e":"Der Fragenkatalog nennt diese Informationsquellen."},{"q":"Was bedeutet „in die rechte Schleuse einfahren“?","opts":["Die rechte Schleuse aus Sicht talwärts; für den Bergfahrer ist das die linke Schleuse","Die Schleuse rechts in Fahrtrichtung des eigenen Fahrzeugs","Die rechte Schleuse aus Sicht bergwärts; für den Talfahrer ist das die linke Schleuse","Die jeweils durch grünes Licht freigegebene Schleuse wird als rechte Schleuse bezeichnet"],"a":0,"e":"Die Bezeichnung rechts/links erfolgt talwärts gesehen."},{"q":"Welche Aussage zur Schleusung ist richtig?","opts":["Anmelden, Anweisungen und Lichtsignale beachten, Rettungswesten für Deckmannschaft, Fender verwenden und auf Slip verheften","Anmelden, Lichtsignale beachten, Leinen fest belegen und Motor während der gesamten Schleusung laufen lassen","Ohne Anmeldung einfahren, wenn grünes Licht gezeigt wird; Fender sind nur für Großfahrzeuge nötig","Anmelden und Anweisungen beachten; Rettungswesten sind für Deckmannschaft nur bei Nacht vorgeschrieben"],"a":0,"e":"Diese Schritte werden im Fragenkatalog für eine Schleusung beschrieben."},{"q":"Was versteht man unter Stillliegen?","opts":["Festmachen oder Ankern","Festmachen, Ankern oder Treibenlassen ohne Maschinenkraft","Nur Festmachen an einem Ufer oder Steg","Jedes Fahrzeug, das keine Fahrt durchs Wasser macht"],"a":0,"e":"Stillliegen umfasst Festmachen und Ankern."},{"q":"Welche Stelle gehört zu den Stillliegeverboten?","opts":["Fahrwasserengen","Außerhalb des Fahrwassers im Bereich einer gekennzeichneten Liegestelle","Am Rand eines breiten Fahrwassers, sofern niemand behindert wird","In einer Bucht außerhalb der Fahrrinne"],"a":0,"e":"Stillliegen ist u.a. in Fahrwasserengen verboten."},{"q":"Welche österreichischen Flüsse zählen im Fragenkatalog zu den Wasserstraßen?","opts":["Donau und Donaukanal, March bis km 6,0, Enns bis km 2,7, Traun bis km 1,8 samt Nebenarmen","Donau und Donaukanal, March bis km 6,0, Enns bis km 1,8, Traun bis km 2,7 samt Nebenarmen","Donau, Donaukanal und March vollständig sowie Enns und Traun bis zur Staatsgrenze","Donau und Donaukanal sowie Inn, Salzach, Enns und Traun in ihrem gesamten österreichischen Verlauf"],"a":0,"e":"Diese Wasserstraßen samt Kilometrierung werden am Ende des Fragenkatalogs genannt."},{"q":"Brückendurchfahrt: Welche Aussage zur dargestellten Brücke ist richtig?","opts":["Talfahrer: 1. und 4. Joch erlaubt; 2. Joch nur innerhalb der weißen Markierung und ohne Gegenverkehr; 3. Joch verboten","Talfahrer: 1. und 3. Joch erlaubt; 2. Joch nur ohne Gegenverkehr; 4. Joch verboten","Talfahrer: 1. und 4. Joch erlaubt; 2. Joch auch mit Gegenverkehr; 3. Joch verboten","Talfahrer: nur 2. und 4. Joch erlaubt; 1. und 3. Joch verboten"],"a":0,"e":"So beschreibt der Fragenkatalog die Brückendurchfahrt.","img":"bridge11"}];

let order=[], idx=0, points=0, answered=false, chosen=null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function start(){
  order = shuffle(QUESTIONS.map((_,i)=>i));
  idx=0; points=0; answered=false; chosen=null;
  render();
}

function render(){
  document.getElementById('count').textContent = `Frage ${Math.min(idx+1, order.length)} / ${order.length}`;
  document.getElementById('score').textContent = `Richtig: ${points}`;
  document.getElementById('bar').style.width = `${(idx/order.length)*100}%`;

  if(idx>=order.length){
    const pct=Math.round(points/order.length*100);
    document.getElementById('bar').style.width='100%';
    document.getElementById('quiz').innerHTML = `
      <div class="end"><div class="score">${points} / ${order.length} (${pct}%)</div>
      <p>${pct>=80?'Sehr gut!':pct>=60?'Gut – noch etwas üben.':'Noch einmal durchgehen lohnt sich.'}</p>
      <button class="ctrl" onclick="start()">Neu starten</button></div>`;
    return;
  }

  const q=QUESTIONS[order[idx]];
  let pairs=q.opts.map((t,i)=>({t,correct:i===q.a}));
  shuffle(pairs);

  const img = q.img ? `<img class="diagram" src="${IMG[q.img]}" alt="Abbildung zur Frage">` : '';
  const opts = pairs.map((o,i)=>`<button class="opt" data-correct="${o.correct?1:0}" onclick="pick(this)">${o.t}</button>`).join('');
  document.getElementById('quiz').innerHTML = `
    ${img}
    <div class="q">${q.q}</div>
    <div id="opts">${opts}</div>
    <div class="expl" id="expl"><b>Erklärung:</b> ${q.e}</div>
    <div class="controls">
      <button class="ctrl secondary" onclick="skip()">Überspringen</button>
      <button class="ctrl" id="next" onclick="next()" disabled>Weiter</button>
    </div>`;
  answered=false;
}

function pick(btn){
  if(answered) return;
  answered=true;
  const all=[...document.querySelectorAll('.opt')];
  const ok=btn.dataset.correct==='1';
  if(ok){points++; btn.classList.add('correct')} else {
    btn.classList.add('wrong');
    const right=all.find(x=>x.dataset.correct==='1'); if(right) right.classList.add('correct');
  }
  all.forEach(x=>x.disabled=true);
  document.getElementById('expl').style.display='block';
  document.getElementById('next').disabled=false;
  document.getElementById('score').textContent = `Richtig: ${points}`;
}

function next(){idx++; render();}
function skip(){idx++; render();}
start();
</script>
