<style>
:root { --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#667085; --ok:#eaf8ef; --bad:#fff0f0; --accent:#1f5fbf; }
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:920px;margin:0 auto;padding:18px}
.header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0} .small{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(20,30,55,.08)}
.progress{height:10px;background:#e6eaf1;border-radius:999px;overflow:hidden;margin:12px 0 18px}
.bar{height:100%;background:var(--accent);width:0%}
.q{font-weight:750;font-size:1.16rem;line-height:1.4;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;border:1px solid #d9dfeb;background:#fff;padding:13px 14px;border-radius:12px;margin:9px 0;font-size:1rem;cursor:pointer}
.opt:hover{border-color:#9eb7e4} .opt.correct{background:var(--ok);border-color:#55a86a} .opt.wrong{background:var(--bad);border-color:#d66}
.expl{display:none;margin-top:14px;padding:12px 14px;background:#f7f9fc;border-radius:10px;line-height:1.45}
.controls{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
button.ctrl{border:0;background:#1f5fbf;color:#fff;padding:11px 16px;border-radius:10px;font-weight:650;cursor:pointer}
button.ctrl.secondary{background:#687386}
button.ctrl:disabled{opacity:.45;cursor:not-allowed}
img.diagram{width:100%;max-height:560px;object-fit:contain;background:#fff;border:1px solid #e2e7ef;border-radius:10px;margin:0 0 14px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-weight:650}
.end{text-align:center;padding:18px 0} .score{font-size:2rem;font-weight:800}
.switch{display:flex;gap:8px;align-items:center;font-size:.92rem}
</style>

let order=[], idx=0, points=0, answered=false, chosen=null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function start(){
  order = shuffle(QUESTIONS.map((_,i)=>i));
  idx=0; points=0; answered=false; chosen=null;
  render();
}

function render(){
  document.getElementById('count').textContent = `Frage ${Math.min(idx+1, order.length)} / ${order.length}`;
  document.getElementById('score').textContent = `Richtig: ${points}`;
  document.getElementById('bar').style.width = `${(idx/order.length)*100}%`;

  if(idx>=order.length){
    const pct=Math.round(points/order.length*100);
    document.getElementById('bar').style.width='100%';
    document.getElementById('quiz').innerHTML = `
      <div class="end"><div class="score">${points} / ${order.length} (${pct}%)</div>
      <p>${pct>=80?'Sehr gut!':pct>=60?'Gut – noch etwas üben.':'Noch einmal durchgehen lohnt sich.'}</p>
      <button class="ctrl" onclick="start()">Neu starten</button></div>`;
    return;
  }

  const q=QUESTIONS[order[idx]];
  let pairs=q.opts.map((t,i)=>({t,correct:i===q.a}));
  shuffle(pairs);

  const img = q.img ? `<img class="diagram" src="${IMG[q.img]}" alt="Abbildung zur Frage">` : '';
  const opts = pairs.map((o,i)=>`<button class="opt" data-correct="${o.correct?1:0}" onclick="pick(this)">${o.t}</button>`).join('');
  document.getElementById('quiz').innerHTML = `
    ${img}
    <div class="q">${q.q}</div>
    <div id="opts">${opts}</div>
    <div class="expl" id="expl"><b>Erklärung:</b> ${q.e}</div>
    <div class="controls">
      <button class="ctrl secondary" onclick="skip()">Überspringen</button>
      <button class="ctrl" id="next" onclick="next()" disabled>Weiter</button>
    </div>`;
  answered=false;
}

function pick(btn){
  if(answered) return;
  answered=true;
  const all=[...document.querySelectorAll('.opt')];
  const ok=btn.dataset.correct==='1';
  if(ok){points++; btn.classList.add('correct')} else {
    btn.classList.add('wrong');
    const right=all.find(x=>x.dataset.correct==='1'); if(right) right.classList.add('correct');
  }
  all.forEach(x=>x.disabled=true);
  document.getElementById('expl').style.display='block';
  document.getElementById('next').disabled=false;
  document.getElementById('score').textContent = `Richtig: ${points}`;
}

function next(){idx++; render();}
function skip(){idx++; render();}
start();
</script>
</body>
</html>
