igene Nationalflagge"], "a": 1, "img": null}, {"n": 31, "q": "Kann der Schiffsführer seine Verantwortung für Schiff und Mannschaft auf ein anderes Crewmitglied übertragen?", "o": ["Ja, der Schiffsführer kann ein anderes Crewmitglied bestimmen, die gesamte Verantwortung zu übernehmen", "Ja, der Schiffsführer kann Teile seiner Verantwortung an einzelne Crewmitglieder übertragen", "Nein, die Verantwortung des Schiffsführers kann nicht übertragen werden", "Schiffsführer auf Binnengewässern tragen keine besondere Verantwortung"], "a": 2, "img": null}, {"n": 32, "q": "Wie verhalten Sie sich, wenn Sie auf einem österreichischen See segeln und einem Motorboot begegnen, das einen Wasserskifahrer schleppt?", "o": ["Beide Fahrzeuge weichen nach Steuerbord aus", "Ich weiche aus, da es sich um einen Schleppverband handelt", "Ich weiche aus, da Sportboote Maschinenfahrzeugen ausweichen müssen", "Ich halte Kurs. Maschinenfahrzeuge müssen Segelfahrzeugen ausweichen"], "a": 1, "img": null}, {"n": 33, "q": "Welchen Sinn hat das Beidrehen in schwerem Wetter?", "o": ["Es hilft, das Schiff im Wind zu halten", "Es versetzt das Schiff in eine relativ ruhige Lage", "Es erleichtert, das Schiff auf Kurs zu halten", "Es ermöglicht, das Großsegel zu reffen."], "a": 1, "img": null}, {"n": 34, "q": "Ihre Jolle ist gekentert und Sie sind nicht mehr in der Lage, sie wieder aufzurichten. Was tun Sie?", "o": ["Das Boot durchkentern lassen und auf dem Rumpf Notsignale abgeben. Keinesfalls das Boot verlassen", "Boot durchkentern lassen und versuchen ans Ufer zu schwimmen", "Mit dem durchgekenterten Boot ans Ufer paddeln", "Ein gekentertes Boot kann man immer aufrichten"], "a": 0, "img": null}, {"n": 35, "q": "Sie stellen in Ihrem Kielboot ein Leck fest. Was können Sie tun?", "o": ["Das Boot sofort verlassen und ans Ufer schwimmen", "Mit Decken oder ähnlichem den Wassereinbruch verlangsamen. Mit allen verfügbaren Mitteln lenzen.", "Jeder an Bord springt sofort ins Wasser und schwimmt auf eigene Faust zum Ufer", "Nichts, ein Kielboot ist ohnehin unsinkbar"], "a": 1, "img": null}, {"n": 36, "q": "Wie ändert sich der Wind an Bord eines Segelbootes auf Kurs am Wind, das plötzlich auf eine Untiefe festkommt?", "o": ["Er wird stärker und fällt achterlicher ein", "Er wird schwächer und fällt achterlicher ein", "Er wird stärker und fällt vorlicher ein", "Er wird schwächer und fällt vorlicher ein"], "a": 1, "img": null}, {"n": 37, "q": "Welche Sofortmaßnahmen sind sinnvoll bei einem Mastbruch?", "o": ["Versuchen, das Durchkentern zu verhindern", "Sofort das Boot verlassen und ans Ufer schwimmen", "Versuchen, die gebrochenen Teile des Mastes an Deck zu sichern", "Versuchen, das Boot durchkentern zu lassen und beim Boot auf Hilfe warten"], "a": 2, "img": null}, {"n": 38, "q": "Welche Sofortmaßnahmen treffen Sie bei Person über Bord?", "o": ["Ruhe bewahren und weiter segeln. In österreichischen Seen ist das Ufer nahe genug", "Ruhe bewahren, Kurs halten, mit der Mannschaft in Ruhe das Manöver besprechen", "Ruhe bewahren und mit dem Handy die nächste Polizeidienststelle benachrichtigen", "Ruhe bewahren, Rettungsmittel nachwerfen, Mannschaft alarmieren, POB Manöver einleiten"], "a": 3, "img": null}, {"n": 39, "q": "Sie sehen die abgebildete Person. Was will diese Person signalisieren?", "o": ["„Ich ändere meinen Kurs nach Backbord“", "„Kommen Sie nicht näher, Sie begeben sich in Gefahr“", "„Stoppen Sie Ihre Fahrt, wir kommen an Bord“", "„Ich bin in Seenot. Ich benötige dringend Hilfe“"], "a": 3, "img": "data:image/webp;base64,UklGRhocAABXRUJQVlA4IA4cAACwfwCdASr0AaQAPj0cjEOiIyGWCxyIMAPEsbaIYMb3RVG+cFO+qBWA73w9Et5urmPzF+SeGfi4xQOl8t/qI8z+1H05fd76s364dijzNebj6gfJV68r0YOmu8mbN8dTD9s+3egp/N/xj+m/wfJ3wFPyn+s/5zh8QF/pveqGa8yx/s+B//sgcbWx42+tcpq6MRniDlcKsyMsstC8aNUxSUJoXghAbrTvPSFxi8t0XhAaH2S4cJqm+XCw2MSdVbpRXdeKH25DBCA0OH7P81axtnkh6G2biTxec4BA4vaIi1x3IzLYqKTW0I7jtb3G6A8wi6hG7jZ0QQK4ctMhA3AHzsK+y7CGf9aR35mzbD0aolMa0e2Y1CFEws5PqYr2W6GTGwGilnegbm28lQG9qlpRa8pssK0FTj1uFsebAubX0IjBoqxizX0Y  <button class="navbtn" onclick="next()">${i===Q.length-1?'Auswertung':'Weiter →'}</button></div>`;
 if(answered) showState();
}
function pick(k){ if(choices[i]!==null)return; choices[i]=k; if(k===Q[i].a)score++; showState(); }
function showState(){
 const x=Q[i], k=choices[i], bs=[...document.querySelectorAll('.opt')];
 bs.forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add('correct');if(j===k&&j!==x.a)b.classList.add('wrong')});
 const fb=document.getElementById('fb'); if(k===x.a){fb.textContent='Richtig ✓';fb.className='feedback good'}
 else{fb.textContent='Falsch – richtige Antwort: '+String.fromCharCode(65+x.a);fb.className='feedback bad'}
}
function prev(){if(i>0){i--;render()}}
function next(){if(i<Q.length-1){i++;render()}else result()}
function result(){
 const done=choices.filter(x=>x!==null).length;
 document.getElementById('app').innerHTML=`<div class="score"><h2>Auswertung</h2><p><b>${score} von ${Q.length}</b> Fragen richtig.</p><p>Beantwortet: ${done} von ${Q.length}</p><button class="navbtn restart" onclick="restart()">Noch einmal starten</button></div>`;
}
function restart(){i=0;score=0;choices=Array(Q.length).fill(null);render()}
render();
</script></body></html>
