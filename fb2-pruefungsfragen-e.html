<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prüfungsfragen E</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#16202b}
header{background:#07599c;color:white;padding:18px;text-align:center}
main{max-width:850px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}
button,select{font-size:17px}
button{border:0;border-radius:10px;padding:13px 16px;cursor:pointer}
.primary{background:#07599c;color:white}
.ans{display:block;width:100%;text-align:left;background:#eef4fa;margin:9px 0}
.good{background:#d9f5df!important}
.bad{background:#ffdede!important}
.muted{color:#607080}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#result{font-size:22px;font-weight:bold}
select{padding:10px;border-radius:8px}
</style>
</head>

<body>
<header>
<h1>Yachtschule Schwaiger</h1>
<div>FB2 · Prüfungsfragen E</div>
</header>

<main>
<div id="start" class="card">
<h2>Single Choice</h2>
<p>Wähle einen Bereich oder übe alle Fragen gemischt.</p>
<div class="row">
<select id="area"></select>
<button class="primary" onclick="start()">Start</button>
</div>
</div>

<div id="quiz" class="card" hidden>
<div class="row">
<b id="count"></b>
<span id="score" style="margin-left:auto"></span>
</div>
<h2 id="question"></h2>
<div id="answers"></div>
<button id="next" class="primary" onclick="nextQ()" hidden>Nächste Frage</button>
</div>

<div id="done" class="card" hidden>
<h2>Ergebnis</h2>
<div id="result"></div>
<p id="detail"></p>
<button class="primary" onclick="start()">Noch einmal</button>
</div>
</main>

<script>
const Q=[
{"code":"A1","q":"Welcher Knoten ist besonders geeignet, ein Auge in einen Tampen einzubinden?","a":["der Roringstek","der Palstek","der Augspleiß","der Augstek"],"c":1},
{"code":"A2","q":"Ist die Reduzierung der Bruchlast bei allen Knoten gleich groß?","a":["nein, sie ist pro Knoten unterschiedlich","nein, aber sie ist vernachlässigbar klein","ja, sie ist bei allen Knoten 20%","nein, sie ist bei Steken kleiner als bei Knoten"],"c":0},
{"code":"A3","q":"Ist es ratsam, gegen Wind und Strom anzulegen?","a":["nein, nur bei Anlegen mit Wind und Strom behält man Ruderwirkung","ja, aber nur bei Kojen mit Mooringleinen","nein, weil es als unseemännisch gilt","ja, bei Anlegen gegen Wind und Strom behält man Ruderwirkung"],"c":3},
{"code":"A4","q":"Die Bedienung der Leinen und Fender beim Anlegen...","a":["wird nur zwischen Skipper und Co-Skipper verteilt","wird mit der Crewverteilung auf die Crew verteilt","wird von der Crew niemals geändert","wird von den Marineros des Hafens gemacht"],"c":1},
{"code":"A5","q":"Wie ist eine Muringline meistens aufgebaut?","a":["Pilotmuring - Block - Schraubenfänger","Muringblock - Polleinen - Belegleine","Muringblock - Belegleine - Pilotleine","Belegleine - Muringblock - Pilotrosse"],"c":2},
{"code":"A6","q":"Wie stellen Sie zum Abschluss des Ankermanövers fest ob Ihr Anker hält?","a":["wenn unter „Maschine achteraus“ keine Fahrt über Grund gemacht wird","durch den Abstand vom Schiff zur Ankerboje","durch Kontrolle des Abhebewinkels der Kette","durch Dichtholen der Ankerkette, bis der Bug der Yacht „nickt“"],"c":0},
{"code":"A7","q":"Was ist die Kettennuss?","a":["der Hebel an der Ankerwisch, mit welchem die Kette weitertransportiert wird","das Rad an der Ankerwisch, welches die Kette weitertransportiert","die drehbare Befestigung der Kette am Ankerring","die Gesamtheit der liegenden Kette im Ankerkasten"],"c":1},
{"code":"A8","q":"Was gehört zu den wichtigsten Informationen in einem Reiseplan laut Solas V?","a":["Exakte Abfahrts- und Ankunftszeiten, exakte Hoch- und Niedrigwasserzeiten","Charterpapiere, Flugtickets, Schiffsname","Route und Schiffspapiere","Wetter, Tiden, Hafeninformationen, Streckenlängen"],"c":3},
{"code":"A9","q":"Welche sicherheitsrelevante Ausrüstung ist für Österreichische Schiffe im Fahrtbereich 2 zusätzlich gegenüber Fahrtbereich 1 vorgeschrieben?","a":["Rettungsweste für jede Person an Bord","Pyrotechnische Notsignale und UKW Funk","Treibanker und Rauchboje","Peilkompass und wasserdichte Signallampe"],"c":2},
{"code":"A10","q":"Was ist wichtig beim Nachtanken aus dem Kanister?","a":["es darf kein Treibstoff ins Meer gelangen","es darf kein Treibstoff im Kanister zurückbleiben","es darf kein Trichter ohne Feuerschutzschalter verwendet werden","rund um das Schiff Öl ins Wasser geben zur Beruhigung der See"],"c":0},

{"code":"B1","q":"Was ist die Bilge?","a":["vorderer Bereich des Schiffes","ein abgeschlossener Luftraum, der bei einer Kollision einen Auftriebskörper bildet","Raum zwischen Kiel und Bodenbrettern","hinterer Bereich eines Schiffes"],"c":2},
{"code":"B2","q":"Wann ist ein Schiff „formstabil“?","a":["wenn der Rumpf bei Belastung seine Form beibehält","wenn vorwiegend das Gewicht des Kieles gegen das krängende Moment wirkt","wenn vorwiegend der Auftrieb des untergetauchten Rumpfes gegen das krängende Moment wirkt","wenn es einen mit Spanten und Stringern verstärkten Rumpf hat"],"c":2},
{"code":"B3","q":"Warum haben Boote auch eine händisch bedienbare Bilgepumpe?","a":["weil händisch bedienbare Bilgepumpen weniger störanfällig sind","weil es früher nur händisch bedienbare Bilgepumpen gab, und diese noch immer vorgeschrieben sind","weil händisch bedienbare Bilgepumpen auch bis in den tiefsten Kielraum reichen","weil motorische Bilgepumpen Kohlendioxyd ausstoßen"],"c":0},
{"code":"B4","q":"Was messen Sie mit einem Voltmeter?","a":["die Kapazität der Elektrizität","die Stromstärke der Elektrizität","die Spannung der Elektrizität","den Widerstand der Elektrizität"],"c":2},

{"code":"C1","q":"Ist der Wert der Missweisung immer gleich?","a":["nein, der Wert ist vom gefahrenen Kurs abhängig und wird aus der Variationstabelle entnommen","ja, sofern an der elektrischen Anlage keine Veränderungen vorgenommen wurden","nein, das Vorzeichen Missweisung ist von nördlicher und südlicher Hemisphäre abhängig","nein, der aktuelle Wert wird aus der Seekarte entnommen"],"c":3},
{"code":"C2","q":"Sie lesen in den Gezeitentafeln UTC+1. Was bedeutet das?","a":["MESZ","Mitteleuropäische Zeit","Greenwich Sommerzeit","Osteuropäische Zeit"],"c":1},
{"code":"C3","q":"Wie funktioniert ein Echolot?","a":["Transducer sendet Ultraschall-Impulse aus, die am Boden reflektiert und wieder empfangen werden","Zeit von Aussendung bis Echo wird mit Schallgeschwindigkeit im Wasser addiert","Geschwindigkeit/2","Transducer sendet Radarstrahl aus"],"c":0},
{"code":"C4","q":"Welche Vorteile hat der elektronische Kompass-Sensor?","a":["er funktioniert auch direkt am magnetischen Nordpol","er benötigt keine Stromversorgung","er misst den Kurs über Grund","seine Anzeigewerte können auch von anderen Geräten benutzt werden"],"c":3},
{"code":"C5","q":"Ein Radargerät arbeitet „Head Up“. Was sagt Ihnen diese Bezeichnung?","a":["das RADAR-Bild ist auf den Soll-Kurs ausgerichtet","das RADAR-Bild ist nach MgNord ausgerichtet","das RADAR-Bild ist auf rechtweisend Nord ausgerichtet","das RADAR-Bild ist auf die Schiffslängsachse ausgerichtet"],"c":3},
{"code":"C6","q":"Wodurch entstehen die Gezeiten?","a":["durch die Beeinflussung der Zugbahnen der Tiefdruckgebiete durch Mond und Sonne","durch Anziehungskräfte von Mond und Sonne und Fliehkräfte der Erde","durch die starke Fliehkraft des Mondes bei Annäherung bei Vollmond","durch die Corioliskraft von Mond und Sonne auf der Erde"],"c":1},
{"code":"C7","q":"Wann ist die Missweisung positiv?","a":["auf Südkursen, wenn der Kompass vor der Maschine montiert ist","in der Karibik immer","wenn die Kompassnadel nach Westen hin abweicht","wenn die Kompassrose nach Osten hin abweicht"],"c":3},
{"code":"C8","q":"Wie heißt der Anteil der Schiffs-Geschwindigkeit in Zielrichtung bei der Zielfahrt?","a":["Velocity made good (VMG)","Velocity to target (VTT)","Dead Reckoning Velocity (DRV)","Direct made Velocity (DMV)"],"c":0},

{"code":"D1","q":"Wie hat sich ein Kurshalter zu verhalten?","a":["er muss Kurs und Geschwindigkeit in jedem Fall beibehalten, auch wenn das ausweichpflichtige Fahrzeug nicht ausweicht","er muss den Kurs beibehalten und die Geschwindigkeit so wählen, wie sie zur Vermeidung eines Zusammenstoßes erforderlich ist","er muss zunächst Kurs und Geschwindigkeit beibehalten und muss gegebenenfalls so manövrieren, wie es zur Vermeidung eines Zusammenstoßes am dienlichsten ist","er muss besonders Ausguck halten und die Geschwindigkeit reduzieren"],"c":2},
{"code":"D2","q":"Zwei Maschinenfahrzeuge begegnen einander. Es besteht die Möglichkeit der Gefahr eines Zusammenstoßes. Verhalten sie sich laut KVR Kapitel „Ausweich- und Fahrregeln“ richtig?","a":["ja, aber die Ausweichrichtung ist egal","nicht in jedem Fall, der größere ändert als erster den Kurs, der andere richtet sich danach","nein, beide sollten den Kurs nach BB ändern","ja, beide ändern Kurs nach Stb"],"c":3},
{"code":"D3","q":"Welche Lichter führt ein Segelfahrzeug unter Segel nach Sonnenuntergang?","a":["Navigationslichter rot und grün, Hecklicht, kein Toplicht","Navigationslichter rot und grün, Hecklicht und Toplicht","Navigationslichter weiß, Hecklicht gelb, Toplicht","Navigationslichter rot und grün am Mast, Toplicht am Achterstag"],"c":0},
{"code":"D4","q":"Welche Dokumente benötigen Sie beim Einklarieren im Allgemeinen?","a":["Personalausweise, Befähigungsausweis FB3, Funk-Zertifikat SRC","Zulassungsschein, Standardnach, Pässe der Crew","Schiffspapiere, Versicherungsnachweis, Funkanlagenbetriebserlaubnis, Crewliste, Pässe der Crew","Urlaubsausweis eines Yachtclubs, Grüne Karte für Yachten, bestätigte Crewliste"],"c":2},

{"code":"E1","q":"Was unterscheidet relative Luftfeuchtigkeit von absoluter Luftfeuchtigkeit?","a":["relative Luftfeuchtigkeit gibt das prozentuelle Verhältnis zum maximal möglichen Wert an, absolute Luftfeuchtigkeit den tatsächlichen Wassergehalt der Luft","relative Luftfeuchtigkeit gibt das prozentuelle Verhältnis zum Wert des Vortages an","relative Luftfeuchtigkeit steigt bei Temperaturerhöhung","relative Luftfeuchtigkeit gibt den gefühlten Wert an"],"c":0},
{"code":"E2","q":"In welcher Maßeinheit wird der Luftdruck angegeben?","a":["in Hektopascal","in Kelvin (k)","in % pro m Luftsäule","in Grad Fahrenheit"],"c":0},
{"code":"E3","q":"Was verstehen Sie unter einem Düseneffekt?","a":["Erhöhung der Windgeschwindigkeit wenn Wind um eine einzelne Insel strömt","Erhöhung der Windgeschwindigkeit wenn Wind um ein Kap herumgeführt wird","Erhöhung der Windgeschwindigkeit wenn Wind auf ein Küstengebirge auftrifft","Erhöhung der Windgeschwindigkeit wenn der Wind zwischen zwei Inseln durchweht"],"c":3},
{"code":"E4","q":"Unter welchen Voraussetzungen können sich lokale Gewitter bilden?","a":["lokale Erkaltung der Erdoberfläche und Bildung von hammerförmigen Eiswolken","lokale Erwärmung der Erdoberfläche und Bildung von hammerförmigen Wolken","lokale Erhöhung der Luftfeuchtigkeit auf 100% und Bildung von Cirrostratuswolken","lokale Erwärmung der Luftmassen in großer Höhe und Bildung von Nimbostratuswolken"],"c":1},

{"code":"F9","q":"POB (Person Over Board) auf See, was unternehmen Sie?","a":["Securite Ruf über Funk abgeben damit die Person nicht überfahren wird","Pan Pan Ruf über Funk abgeben, sofort nachspringen und Erste Hilfe leisten","Mayday abgeben, ein geeignetes Manöver unter Maschine einleiten","sofort einen Treibanker an einer 100m langen Rettungsleine ausbringen"],"c":2},
{"code":"F10","q":"Welches Funksignal kann zur Auffindung von Personen verwendet werden, die über Bord gegangen sind?","a":["AIS, Automatic Information System","OEM, Orientation Effected by Man","SOLAS, Safety of Life at Sea","MARPOL, Maritime Policecar"],"c":0},

{"code":"M1","q":"Was kann die Färbung des Auspuffrauches anzeigen?","a":["Druck der Einspritzpumpe","zu hohe Drehzahl, Temperatur","Öl, Wasser oder zuwenig Luft","zuviel Luft und damit Gas im Auspuff"],"c":2},
{"code":"M2","q":"Ein Nachteil eines Dieselmotors ist, dass","a":["er höher dreht","er einen schlechten Wirkungsgrad hat","er in der Anschaffung teurer ist","er kürzere Wartungsintervalle hat"],"c":2},
{"code":"M3","q":"Soll bei einem Ölwechsel immer auch der Ölfilter gewechselt werden?","a":["ja","nein","nein, ist bei neueren Motoren wegen der kleineren Fertigungstoleranzen nicht notwendig","ja, die Filter sind mit einem Chip versehen"],"c":0},
{"code":"M4","q":"Was bezeichnet man beim Schiffsmotor als „nassen Auspuff“?","a":["ein Auspuff, bei dem auch flüssiger Treibstoff entweicht","ein Auspuff, bei dem die Auspuffgase mit Wasser gekühlt werden","ein Auspuff, der unter der Wasserlinie liegt","ein Auspuff, durch den das Kühlwasser eingesaugt wird"],"c":1},
{"code":"M5","q":"Wofür dient die Schraube unten am Wasserabscheider?","a":["zum Öffnen des Filtergehäuses","zum Einfüllen des Wassers","zum Ablassen des Treibstoffes","zum Ablassen des Wassers"],"c":3},
{"code":"M6","q":"Wie stellen Sie den richtigen Motorölstand fest?","a":["durch einen Blick auf das Manometer","mit dem Ölmessstab bei abgestelltem Motor","durch Kontrolle im Schauglas","durch Herausdrehen und Kontrollieren der Ölablassschraube"],"c":1},
{"code":"M7","q":"Warum befindet sich im Motorraum automatische Feuerlöscher?","a":["weil sie bei geschlossenem Motorabdeckung arbeiten müssen","weil nur die Auslöseautomatik den besten Zeitpunkt zum Auslösen feststellen kann","weil sie auch für andere Brände automatisch auslösen","weil sie erst auslösen wenn alle anderen Feuerlöscher leer sind"],"c":0},
{"code":"M8","q":"Warum soll die Lüftungsschraube am tragbaren Tank geschlossen sein wenn er längere Zeit steht?","a":["damit die im mineralischen Treibstoffen vorhandenen Amöben sich nicht vermehren können","damit sich der Benzindampfraum (pyknometrisch) nicht bilden kann","damit sich kein Kondenswasser bildet","damit keine Insekten eindringen"],"c":2},
{"code":"M9","q":"Warum braucht ein Motorenschiff mit Z-Antrieb kein Ruderblatt?","a":["weil es mit den Z-Düsen seitlich steuerbar ist","weil der Antrieb horizontal verdrehbar ist","weil im Gleitfahrt mit Lallwirkung gesteuert wird","weil der Antrieb vertikal verstellbar ist"],"c":1},
{"code":"M10","q":"Welche Anschlussleitungen brauchen Diesel-Treibstofftanks außer der Öffnung zum Tanken?","a":["Zählerleitung, Motordruckausgleichsleitung, Treibstoffabsaugleitung","Gaszug, Pumpenleitung, Auslaufleitung","Absaugleitung, Gaszuleitung, Treibstoffausgleichsleitung","Ansaugleitung, Rückflussleitung, Entlüftungsleitung"],"c":3},
{"code":"M11","q":"Die im Bild dargestellte Propelleranlage nennt man...","a":["Duo-Prop","Zweierprop","Drehrichtungsänderungsprop","Anti Kavitationsprop"],"c":0},
{"code":"M12","q":"Wann ist die Ruderwirkung besonders groß?","a":["wenn der Propellerstrahl das Ruder nicht behindert","wenn das Ruder seitlich vom Propeller ist","wenn der Propellerstrahl das Ruder direkt anströmt","wenn der Propeller eine große Steigung hat"],"c":2},

{"code":"S1","q":"Was ist ein Traveller?","a":["Schiene an der das Vorsegel angeschlagen ist zum Aufrollen","Rutscher zum Aufziehen des Großsegels am Mast","Vorrichtung zum Verstellen des Holepunktes der Großschot","leichte Fahrtenyacht"],"c":2},
{"code":"S2","q":"Was ist ein Fahrtwind?","a":["der durch die Fahrt über Grund verursachte Wind","der für die Fahrt vorausgesagte Wind","der vom Windstärkenmesser (Wind am See)","der durch die rechtweisende Fahrt verursachte Wind"],"c":0},
{"code":"S3","q":"Welches Vorsegel ist für Wind mit Sturmstärke gedacht?","a":["Trysegel","Sturmgenoa","Mini-Vorsegel","Sturmfock"],"c":3},
{"code":"S4","q":"Wie leite ich das Reffen des Großsegels ein?","a":["abfallen, Fall dichtholen, Dirk fieren","Schot fieren, Dirk anholen, Fall fieren","Schot fieren, Fall dichtholen, Dirk fieren","Schot dichtholen, Dirk dichtholen, Fall fieren"],"c":1},
{"code":"S5","q":"Wie äußert sich „Leegierigkeit“?","a":["das Schiff versucht den Bug ins Wasser zu drücken","das Schiff versucht sich vom Wind wegzudrehen","das Schiff versucht parallel nach Lee zu treiben","das Schiff versucht sich zum Wind zu drehen"],"c":1},
{"code":"S6","q":"Welche Unterstützung der Crew braucht der Rudergänger meist bei einer Wende?","a":["Bedienung des Autopiloten","Bedienung des Genuafalls","Bedienung der Genuaschoten","Bedienung der Wendeleine"],"c":2},
{"code":"S7","q":"Warum hat ein Segelboot den Segeldruckpunkt meist vor dem Lateraldruckpunkt?","a":["um Luvgierigkeit durch die seitlich angreifenden Segelkräfte auszugleichen","um bei größerer Ruderausschlägen stabil zu bleiben","um Leegierigkeit durch die seitlich angreifenden Segelkräfte auszugleichen","um die Leegierigkeit bei gerefften Segeln auszugleichen"],"c":0},
{"code":"S8","q":"Was kann zum Aufstoppen beim Anlegen unter Segel verwendet werden?","a":["Groß dichtholen","Leinen","Stoppersegel","90° Rudereinschlag"],"c":0},
{"code":"S9","q":"Bis zu welchen Krängungswinkeln kann sich ein „gewichtsstabiles“ Schiff wieder aufrichten?","a":["bei ca. 45 Grad","der maximale Krängungswinkel hängt ab vom Schiffsquerschnitt","bei weniger als 90 Grad","bei mehr als 90 Grad"],"c":3},
{"code":"S10","q":"Wie sieht ein Sturmbock aus?","a":["klein und flach geschnitten","klein und bauchig geschnitten","kurz mit langem straffem Unterliek","hoch und bauchig geschnitten"],"c":0},
{"code":"S11","q":"Wie wird der Mast abgestützt?","a":["durch Vorwanten und Backstagen","durch die Mastfüße","durch Wanten und Stagings","durch Stagwanten und Seiterpottings"],"c":0},
{"code":"S12","q":"Was ist ein Spinnaker?","a":["großes meist symmetrisches Vorsegel","kleines meist symmetrisches Vorsegel","großes meist unsymmetrisches Vorsegel","kleines meist unsymmetrisches Vorsegel"],"c":0},
{"code":"S13","q":"Wozu dient der Wantenschneider?","a":["zum Ablängen der Wanten beim Aufriggen","zum Justieren der Wanten-Spannung","zum Verpressen der Augen in den Fittings","zum Kappen der Wanten"],"c":3},
{"code":"S14","q":"Was sind häufige Ursachen für Mastbruch?","a":["gebrochene Rollgenua und Bugkorbe","gebrochene Stage oder Wanten","gebrochene Fallenstopper","gebrochene Lümmelbeschläge"],"c":1}
];

let pool=[],i=0,points=0;

const area=document.getElementById('area');
const groups=[...new Set(Q.map(x=>x.code[0]))];

area.innerHTML='<option value="ALL">Alle Bereiche gemischt</option>'+
groups.map(x=>`<option value="${x}">Bereich ${x}</option>`).join('');

function shuffle(a){
for(let j=a.length-1;j>0;j--){
let k=Math.floor(Math.random()*(j+1));
[a[j],a[k]]=[a[k],a[j]]
}
return a
}

const startEl=document.getElementById('start');
const quiz=document.getElementById('quiz');
const done=document.getElementById('done');

function start(){
pool=Q.filter(x=>area.value==='ALL'||x.code[0]===area.value)
.map(x=>JSON.parse(JSON.stringify(x)));
shuffle(pool);
i=0;
points=0;
startEl.hidden=true;
done.hidden=true;
quiz.hidden=false;
show()
}

function show(){
let x=pool[i];
count.textContent=`Frage ${i+1} / ${pool.length} · ${x.code}`;
score.textContent=`Richtig: ${points}`;
question.textContent=x.q;
answers.innerHTML='';
next.hidden=true;

let opts=x.a.map((t,n)=>({t,n}));
shuffle(opts);

opts.forEach(o=>{
let b=document.createElement('button');
b.className='ans';
b.textContent=o.t;
b.onclick=()=>choose(b,o.n,x.c);
answers.appendChild(b)
})
}

function choose(btn,n,c){
[...answers.children].forEach(b=>b.disabled=true);

if(n===c){
btn.classList.add('good');
points++
}else{
btn.classList.add('bad');
[...answers.children].forEach(b=>{
if(b.textContent===pool[i].a[c])b.classList.add('good')
})
}

score.textContent=`Richtig: ${points}`;
next.hidden=false
}

function nextQ(){
i++;
if(i<pool.length){
show()
}else{
quiz.hidden=true;
done.hidden=false;
let p=Math.round(points/pool.length*100);
result.textContent=`${points} von ${pool.length} richtig (${p} %)`;
detail.textContent=p>=75?'75-%-Marke erreicht.':'Unter 75 % – weiter üben.'
}
}
</script>
</body>
</html>
