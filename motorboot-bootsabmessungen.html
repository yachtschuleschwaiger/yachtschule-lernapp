let i=0,pts=0,locked=false;
function render(){
 document.getElementById("score").textContent=`Frage ${i+1} von ${Q.length} · Richtig: ${pts}`;
 if(i>=Q.length){document.getElementById("app").innerHTML=`<div style="text-align:center;padding:25px"><h2>Ergebnis</h2><div style="font-size:32px;font-weight:800">${pts} / ${Q.length}</div><br><button id="restart">Neu starten</button></div>`;document.getElementById("restart").onclick=()=>{i=0;pts=0;render()};return;}
 const x=Q[i]; locked=false;
 document.getElementById("app").innerHTML=`<img src="${IMG}" alt="Abmessungen eines Motorbootes"><div class="q">${x.q}</div><div id="opts">${x.o.map((v,n)=>`<button class="opt" data-i="${n}">${v}</button>`).join("")}</div><div class="expl" id="expl">${x.e}</div><div class="controls"><span></span><button id="next" style="display:none">Weiter</button></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 document.getElementById("next").onclick=()=>{i++;render()};
}
function answer(n){
 if(locked)return; locked=true; const x=Q[i];
 document.querySelectorAll(".opt").forEach((b,k)=>{if(k===x.a)b.classList.add("ok"); else if(k===n)b.classList.add("bad"); b.disabled=true;});
 if(n===x.a)pts++;
 document.getElementById("score").textContent=`Frage ${i+1} von ${Q.length} · Richtig: ${pts}`;
 document.getElementById("expl").style.display="block";
 document.getElementById("next").style.display="block";
}
render();
</script>
