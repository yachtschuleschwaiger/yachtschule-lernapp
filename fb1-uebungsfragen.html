*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#142333}
.wrap{max-width:760px;margin:auto;padding:18px} .head{background:#123c63;color:white;padding:20px;border-radius:16px;margin-bottom:14px}
.head h1{margin:0 0 5px;font-size:25px} .card{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 14px #0002}
.meta{display:flex;justify-content:space-between;gap:10px;font-weight:bold;margin-bottom:12px} .bar{height:9px;background:#dde5ec;border-radius:9px;overflow:hidden;margin-bottom:18px}

.opt{display:block;width:100%;text-align:left;border:2px solid #d6e0e8;background:white;border-radius:12px;padding:13px;margin:9px 0;font-size:16px;cursor:pointer}
.opt:hover{background:#f3f7fa} .opt.good{border-color:#228b4e;background:#e9f7ee} .opt.bad{border-color:#c43d3d;background:#fdecec}
.feedback{min-height:28px;font-weight:bold;margin:14px 0} button.action{border:0;border-radius:11px;background:#123c63;color:white;padding:12px 17px;font-size:16px;cursor:pointer;margin:5px 5px 5px 0}

</style></head><body><div class="wrap">
<div class="head"><h1>FB1 Übungsfragen</h1><div>Single Choice · Testversion</div></div>
<div id="quiz" class="card">
 <div class="meta"><span id="counter"></span><span id="score"></span></div><div class="bar"><div id="bar"></div></div>
 <h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback"></div>
 <button id="next" class="action hidden">Nächste Frage</button>
</div>
<div id="result" class="card center hidden">
 <h2>Ergebnis</h2><div id="resultText" class="big"></div><p id="wrongText"></p>
 <button id="repeatWrong" class="action">Falsch beantwortete Fragen wiederholen</button>
 <button id="restart" class="action secondary">Alle Fragen neu starten</button>
</div>
</div>
<script>
const ALL=[{"id": "A1", "q": "Mit welchem Seemannsknoten verbinden Sie zwei ungleiche Enden?", "a": ["Marlschlag", "Schotstek", "Kreuzknoten", "Stopperstek"], "correct": 1}, {"id": "A2", "q": "Was bewirkt ein Knick in einem Tau?", "a": ["Eine Erhöhung der Bruchlast", "Eine Reduzierung der Anzahl der Kardeele", "Eine Erhöhung der Anzahl der Kardeele", "Eine Reduzierung der Bruchlast"], "correct": 3}, {"id": "A3", "q": "Sie haben eine rechtsgängige Schraube. Auf welche Seite wird das Heck bei Fahrt voraus versetzt?", "a": ["es versetzt nach Steuerbord", "es wird nicht das Heck nach Stb versetzt, sondern der Bug", "es versetzt nach Backbord", "es wird nicht das Heck nach Bb versetzt, sondern der Bug"], "correct": 0}, {"id": "A4", "q": "Wie nennt man Boote, die ihre Rumpfgeschwindigkeit wesentlich überschreiten?", "a": ["Raser", "Verdränger", "Gleiter", "Flachboote"], "correct": 2}, {"id": "A5", "q": "Was ist der Vorteil von Plattenankern?", "a": ["sie können je nach Bedarf mit verschiedenen Platten bestückt werden", "sie erzeugen mehr Haltekraft durch im Grund quer gestellte Flächen", "sie können mit Ketten oder mit Trossen ausgebracht werden", "sie erzeugen mehr Haltekraft durch das hohe Gewicht der Platten"], "correct": 1}, {"id": "A6", "q": "Wie kann man messen, ob der Anker schliert?", "a": ["durch Peilungen vorwärts in Richtung der Linie Schiff - Anker", "durch Peilungen rückwärts in Richtung der Linie Schiff - Anker", "durch Peilungen vom Heck zum Bug", "durch Peilungen seitlich zur Linie Schiff - Anker"], "correct": 3}, {"id": "A7", "q": "Welche Flaggen sollte eine Yacht führen?", "a": ["die Nationale, gegebenenfalls die Gastlandflagge", "nur die Nationale des Skippers", "die Nationale, N, C und Q beim Ankommen (einklarieren)", "den Clubstander und die Gastlandflagge"], "correct": 0}, {"id": "A8", "q": "Warum ist die Verwendung von Bojen gegenüber dem Ankern in Buchten umweltschonender?", "a": ["weil mit Benützungsentgelt umweltschonende Maßnahmen gesetzt werden", "weil sich an Bojen die wassereinigenden Buchtenmuscheln ansetzen", "weil der Meeresboden weniger geschädigt wird", "weil Bojenlieger weniger Abfall produzieren"], "correct": 2}, {"id": "B1", "q": "Wann ist ein Schiff \"gewichtsstabil\"?", "a": ["wenn vorwiegend ein tiefer gelegenes Gewicht (Kiel) gegen das krängende Moment wirkt", "wenn trotz Zuladung die Eintauchmarke nicht überschritten wird", "wenn es im Wellengang den Wellen nicht folgt", "wenn vorwiegend der Auftrieb des untergetauchten Teiles gegen das krängende Moment wirkt"], "correct": 0}, {"id": "B2", "q": "Wieso ist Flüssiggas an Bord gefährlich?", "a": ["weil es ein geruchloses Nervengas ist, das zu Verätzungen von Augen und Schleimhäuten führt", "weil es zusammen mit Diesel- und Benzindämpfen stark korrosiv wirkt", "weil es leichter als Luft und giftig ist", "weil es schwerer als Luft und als Gemisch explosiv ist"], "correct": 3}, {"id": "B3", "q": "Was ist typischerweise im Schwarzwasser enthalten?", "a": ["schwarze Tinte", "Fäkalien", "Ölrückstände", "Seifenlauge"], "correct": 1}, {"id": "B4", "q": "Was messen Sie mit dem Ampere-Meter?", "a": ["die Spannung der Elektrizität", "die Kapazität der Elektrizität", "die Stromstärke der Elektrizität", "den Widerstand der Elektrizität"], "correct": 2}, {"id": "C1", "q": "Welche Länge hat eine Seemeile?", "a": ["Seemeile ist 1852 m (1,852 km)", "Seemeile ist 1/10 von 1852 m", "Seemeile ist der 360ste Teil eines Meridians", "Seemeile ist 1,563 km, Äquatorumfang 33760,8 km/21600 =1,563"], "correct": 0}, {"id": "C2", "q": "Welches Instrument misst die Fahrt durchs Wasser?", "a": ["GPS", "Tachometer", "Lot", "Logge"], "correct": 3}, {"id": "C3", "q": "Was ist eine Kreuzpeilung?", "a": ["Peilung eines Kirchturmes von See aus", "nahezu gleichzeitige Peilungen zu zwei verschiedenen Peilobjekten", "zeitlich verschobene Peilungen zu ein und demselben Peilobjekt", "2 zeitlich versetzte Peilungen verschiedener Peilobjekte"], "correct": 1}, {"id": "C4", "q": "Sie sehen dieses Seezeichen. Welche Bedeutung können Sie daraus ablesen?", "a": ["Kardinales Zeichen „S“ im Süden zu umfahren", "Kardinales Zeichen „E“ im Osten zu umfahren", "Kardinales Zeichen „N“ im Norden zu umfahren", "Kardinales Zeichen „W“ im Westen zu umfahren"], "correct": 2}, {"id": "D1", "q": "Ein Segelfahrzeug und ein Motorfahrzeug begegnen einander. Es besteht die Möglichkeit der Gefahr eines Zusammenstoßes. Verhalten Sie sich laut KVR Kapitel „Ausweich- und Fahrregeln“ richtig?", "a": ["nein, gegenüber einem Motorfahrzeug ist das Segelfahrzeug kurshaltepflichtig", "nein, weil das Segelfahrzeug den Wind von Backbord hat", "ja, es gehört zur guten Seemannschaft, dass der mit dem stärkeren Motor nicht behindert wird", "ja, das Motorboot ist schneller, daher soll das Segelboot ausweichen"], "correct": 1}, {"id": "D2", "q": "Wo gelten die Regeln der Colreg / KVR?", "a": ["auf hoher See mit Ausnahme der Karibik und der Straße von Malakka", "auf hoher See und auf den mit diesen zusammenhängenden, von Binnenschiffen befahrbaren Gewässern", "auf hoher See und auf den mit diesen zusammenhängenden, von Seeschiffen befahrbaren Gewässern", "auf hoher See bis zum Hoheitsgewässer eines Staates"], "correct": 2}, {"id": "D3", "q": "Welche Lichter führt ein Maschinenfahrzeug nach Sonnenuntergang?", "a": ["Navigationslichter rot und grün, Hecklicht und Toplicht", "Navigationslichter rot und grün rundum, Toplicht rundum", "Navigationslichter weiß, Hecklicht gelb und Toplicht", "Navigationslichter rot und grün und Hecklicht, kein Toplicht"], "correct": 0}, {"id": "D4", "q": "Gemäß der österreichischen Jachtverordnung ist der Fahrtenbereich 1 bis zu welcher Entfernung von der Küste bzw. Inseln definiert?", "a": ["30 Seemeilen", "12 Seemeilen", "6 Seemeilen", "3 Seemeilen"], "correct": 3}, {"id": "E1", "q": "Wie entstehen die wichtigsten Wettererscheinungen?", "a": ["durch physikalische Interaktion von Wolken und Erde bei verschiedenen Temperaturen in der Atmosphäre", "durch physikalische Interaktion von Luft und Wasser bei verschiedenen Temperaturen in der Troposphäre", "durch physikalische Interaktion von Sauerstoff und Wasserstoff bei verschiedenen Temperaturen in der Stratosphäre", "durch chemische Reaktion von Luft und Wasser bei verschiedenen Temperaturen in der Tropopause"], "correct": 1}, {"id": "E2", "q": "In einer Wetterkarte steht diese graphische Darstellung für:", "a": ["eine Okklusionsfront auf einer Bodenwetterkarte", "eine Warmfront auf einer Bodenwetterkarte", "eine synoptische Darstellung von Quellwolken", "eine Kaltfront auf einer Bodenwetterkarte"], "correct": 3}, {"id": "E3", "q": "Sie sehen diese Wolke, was ist das?", "a": ["Gewitterwolke", "Anzeichen für Scirocco", "Schönwetterbewölkung", "Borawalze"], "correct": 0}, {"id": "E4", "q": "Welche sind typische Adriawinde?", "a": ["Gregale, Ponente, Gibli", "Levantara, Alboran, Vendaval", "Bora, Libeccio, Maestral", "Etesien, Levante, Mistral"], "correct": 2}, {"id": "E5", "q": "Was sind Wettersymbole?", "a": ["kleine grafische Bilder für verschiedene Wettererscheinungen", "Emoticons zur Beschreibung der Wirkung von Wettererscheinungen auf Menschen", "alte Buchstaben zur Wetterkennzeichnung in Bauernkalendern", "kurze Textabkürzungen für verschiedene Wettererscheinungen"], "correct": 0}, {"id": "E6", "q": "Wie ist die Wellenhöhe von Meereswellen definiert?", "a": ["Höhe vom Wellental zur Wellenbergspitze / Wellenlänge", "halbe Höhe vom Wellental zur Wellenbergspitze", "Höhe vom Wellental zur Wellenbergspitze", "Höhe von mittlerem Niveau zur Wellenbergspitze"], "correct": 2}, {"id": "F1", "q": "Wann bezeichnet man eine Rettungsweste als ohnmachtssicher?", "a": ["wenn sie den Kopf über Wasser hält", "wenn sie zusätzlich eine Trillerpfeife hat", "wenn sie auch unter ungünstigen Bedingungen angelegt werden kann", "wenn sie mit einem roten „O“ (für ohnmachtssicher) gekennzeichnet ist"], "correct": 0}, {"id": "F2", "q": "Wie informieren Sie sich über den ordnungsgemäßen Zustand einer Rettungsinsel?", "a": ["optische Kontrolle durchführen", "Überprüfungsdatum steht immer im Chartervertrag", "öffnen und laut Ausrüstungsliste durchchecken", "nächstes erforderliche Überprüfungsdatum ist außen aufgestempelt"], "correct": 3}, {"id": "F3", "q": "Welche Maßnahmen sind zu treffen, um das Überbordgehen von Crewmitgliedern bei starkem Seegang zu verhindern?", "a": ["mit Fender Reling absichern", "nur die notwendige Wache angegurtet an Deck", "alle Rettungswesten anlegen", "alle Personen an Deck oder auf die Flybridge rufen"], "correct": 2}, {"id": "F4", "q": "Was sollte man bei einem Brand im Motorraum tun?", "a": ["den Motorraumzugang nicht öffnen", "das Löschloch als Absaugung benutzen", "den Motorraumzugang öffnen", "den Treibstoffhahn öffnen"], "correct": 0}, {"id": "F5", "q": "Wie schleppt man eine manövrierunfähige Yacht im Hafen?", "a": ["mit einer der Wellenlänge angepassten Schlepptrosse", "vor Ankunft im Hafen wird mit erhöhter Fahrt die Schlepptrosse gelöst", "längsseits, im Paket", "mindestens mit Rumpfgeschwindigkeit, damit Ruderwirkung erhalten bleibt"], "correct": 2}, {"id": "F6", "q": "Was ist ein Bergesegel?", "a": ["ein Vorsegel zum Drehen des Schiffes beim Bergemanöver mit der Bergeschlaufe", "ein Dreieckstuch zum Bergen von Personen aus dem Wasser", "eine Tasche am Großbaum zum Bergen des Großsegels", "ein zylinderförmiges Tuch zum Bergen von Spinnakern"], "correct": 1}, {"id": "M1", "q": "Was versteht man unter Eigenzündung?", "a": ["Zündung durch Einspritzung in den Vergaser", "Zündung durch Einspritzung in hoch komprimierte Luft", "Zündung mittels Glühkerzen", "Zündung mittels Zündkerzen"], "correct": 1}, {"id": "M2", "q": "Wo wird die Sicherheitskordel (Notstopp) des Außenborders befestigt?", "a": ["nirgends, sie hängt frei zur Betätigung im Notfall", "am Handgelenk des Beifahrers", "am Heck des Bootes", "am Handgelenk des Fahrers"], "correct": 3}, {"id": "M3", "q": "Wann deutet weißer Rauch im Auspuff einen Schaden im Motor an?", "a": ["wenn er vom Kühlwasser kommt", "wenn er vom Luftfilter kommt", "wenn er vom Tau im Auspuff kommt", "wenn er vom Motoröl kommt"], "correct": 0}, {"id": "M4", "q": "Warum muss ein Benzin-Innenbordmotor eine Motorraum-Luftabsaugung haben?", "a": ["bei der Tankbefüllung entsteht im Tank ein starker Überdruck, welcher abgelassen werden muss", "das Gasgemisch ist hochgiftig und darf auf keinen Fall eingeatmet werden", "die Benzindämpfe sind schwerer als Luft und könnten im Motorraum zu einer Explosion führen", "Benzinniederschläge im Motorraum können zu Elektrokorrosion führen"], "correct": 2}, {"id": "M5", "q": "Was ist eine indirekte Kühlung?", "a": ["Kühlung durch Wassermantel über dem Schalldämpfer", "Kühlung über Wärmetauscher", "Kühlung durch Zweistufengebläse", "Kühlung durch Peltiersystem"], "correct": 1}, {"id": "M6", "q": "Welche Aufgabe hat der Scherstift eines Außenbordmotors?", "a": ["er sichert den Motor vor dem Abrutschen und Überbordgehen bei hoher Drehzahl", "er stoppt den Motor, wenn der Fahrer ins Wasser stürzt", "er lässt den Motor hochkippen, wenn die Schraube Grundberührung hat", "er ist eine Sollbruchstelle, die bei Blockieren des Propellers bricht"], "correct": 3}, {"id": "M7", "q": "Wie nennt man diesen Antrieb?", "a": ["Saildrive", "Starrer Wellentrieb", "Jet-Trieb", "Z-Trieb"], "correct": 0}, {"id": "M8", "q": "Wie funktioniert die Einhebel Motorsteuerung?", "a": ["Mittelstellung ausgekuppelt, nach vor Einkuppeln und Gas vorwärts, mit gedrücktem Knopf Einkuppeln und Gas rückwärts", "Mittelstellung ausgekuppelt, nach vor und Knopf gedrückt Einkuppeln und Gas vorwärts, nach hinten und Knopf gedrückt Einkuppeln und Gas rückwärts", "Mittelstellung ausgekuppelt, nach vor Einkuppeln und Gas vorwärts, nach hinten Einkuppeln und Gas rückwärts", "Mittelstellung ausgekuppelt, nach rechts Einkuppeln und Gas vorwärts, nach links Einkuppeln und Gas rückwärts"], "correct": 2}];
let pool=[], pos=0, right=0, wrong=[], locked=false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function start(items){pool=items.map(x=>({...x})); shuffle(pool);pos=0;right=0;wrong=[];document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');show();}
function show(){
 locked=false; document.getElementById('next').classList.add('hidden'); document.getElementById('feedback').textContent='';
 const x=pool[pos]; document.getElementById('counter').textContent=`Frage ${pos+1} / ${pool.length} · ${x.id}`;
 document.getElementById('score').textContent=`Richtig: ${right}`; document.getElementById('bar').style.width=`${(pos/pool.length)*100}%`;
 document.getElementById('question').textContent=x.q; const box=document.getElementById('answers'); box.innerHTML='';
 let opts=x.a.map((txt,idx)=>({txt,idx})); shuffle(opts);
 opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o.txt;b.onclick=()=>answer(b,o.idx);box.appendChild(b);});
}
function answer(btn,idx){
 if(locked)return; locked=true; const x=pool[pos]; const buttons=[...document.querySelectorAll('.opt')];
 if(idx===x.correct){btn.classList.add('good');right++;document.getElementById('feedback').textContent='✓ Richtig';}
 else{btn.classList.add('bad');wrong.push(x);document.getElementById('feedback').textContent='✗ Falsch – richtige Antwort ist grün markiert.';
 buttons.forEach(b=>{if(b.textContent===x.a[x.correct])b.classList.add('good')});}
 buttons.forEach(b=>b.disabled=true); document.getElementById('score').textContent=`Richtig: ${right}`; document.getElementById('next').classList.remove('hidden');
}
document.getElementById('next').onclick=()=>{pos++; if(pos>=pool.length)finish(); else show();};
function finish(){
 document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
 document.getElementById('resultText').textContent=`${right} / ${pool.length} richtig`;
 document.getElementById('wrongText').textContent=wrong.length?`${wrong.length} Frage(n) können gezielt wiederholt werden.`:'Alle Fragen richtig beantwortet.';
 document.getElementById('repeatWrong').style.display=wrong.length?'inline-block':'none';
 document.getElementById('bar').style.width='100%';
}
document.getElementById('repeatWrong').onclick=()=>{const w=[...wrong];start(w)};
document.getElementById('restart').onclick=()=>start(ALL);
start(ALL);
</script></body></html>
