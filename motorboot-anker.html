<script>
const questions=[["Wie heißt der Anker oben links?", ["Stockanker", "Pflugscharanker", "Danforthanker", "Faltanker"], 0], ["Wie heißt der Anker oben in der Mitte?", ["Stockanker", "Pflugscharanker", "Danforthanker", "Faltanker"], 1], ["Wie heißt der Anker oben rechts?", ["Bruceanker", "Danforthanker", "Stockanker", "Faltanker"], 1], ["Wie heißt der Anker unten links?", ["Pflugscharanker", "Faltanker", "Danforthanker", "Bruceanker"], 1], ["Wie heißt der Anker unten rechts?", ["Bruceanker", "Stockanker", "Faltanker", "Danforthanker"], 0]], quiz=document.getElementById('quiz');
questions.forEach((q,i)=>{
 const d=document.createElement('div'); d.className='q';
 d.innerHTML=`<h3>${i+1}. ${q[0]}</h3>`+
 q[1].map((a,j)=>`<label id="l${i}_${j}"><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('');
 quiz.appendChild(d);
});
function check(){
 let s=0;
 questions.forEach((q,i)=>{
  document.querySelectorAll(`[id^="l${i}_"]`).forEach(x=>x.classList.remove('correct','wrong'));
  const sel=document.querySelector(`input[name="q${i}"]:checked`);
  document.getElementById(`l${i}_${q[2]}`).classList.add('correct');
  if(sel){if(+sel.value===q[2])s++;else document.getElementById(`l${i}_${sel.value}`).classList.add('wrong');}
 });
 document.getElementById('result').textContent=`Ergebnis: ${s} von ${questions.length} richtig.`;
}
function resetQ(){
 document.querySelectorAll('input').forEach(x=>x.checked=false);
 document.querySelectorAll('label').forEach(x=>x.classList.remove('correct','wrong'));
 document.getElementById('result').textContent='';
 window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
